<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>モデル書き出し | ぴょんぴょん</title>
    <style>
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f4f7f2;
        color: #223;
      }
      h1 { font-size: 20px; }
      .note { color: #556; line-height: 1.6; font-size: 14px; }
      code {
        background: #e7ece4;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 13px;
      }
      button {
        font: inherit;
        padding: 8px 14px;
        border: none;
        border-radius: 8px;
        background: #5aa86a;
        color: #fff;
        cursor: pointer;
      }
      button:hover { background: #4c9a5c; }
      button.all { background: #3b7ddd; margin-bottom: 16px; }
      button.all:hover { background: #2f6ec9; }
      .list { display: flex; flex-direction: column; gap: 8px; max-width: 520px; }
      .row { display: flex; align-items: center; gap: 12px; }
      .row button { min-width: 260px; text-align: left; }
      .status { font-size: 13px; color: #667; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/tools/export-models.js"></script>
  </body>
</html>
